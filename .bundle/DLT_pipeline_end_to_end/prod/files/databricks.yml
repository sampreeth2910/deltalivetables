# This is a Databricks asset bundle definition for DLT_pipeline_end_to_end.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DLT_pipeline_end_to_end
  uuid: 6588cf0e-acd4-423e-9122-d52dc42ff377

include:
  - resources/*.yml
  - resources/*/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: 3469389035490083.3.gcp.databricks.com
    variables:
      catalog: samdb
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: 3469389035490083.3.gcp.databricks.com
      # We explicitly deploy to /Workspace/Users/toteabhinavrm02@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/toteabhinavrm02@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: samdb
      schema: prod
    permissions:
      - user_name: toteabhinavrm02@gmail.com
        level: CAN_MANAGE
